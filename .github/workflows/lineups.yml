name: Record lineups

# Every 5 minutes (GitHub's shortest schedule; runs can start a few minutes late).
# Most runs find no live game and finish in seconds without committing anything.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-lineups
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Record lineups
        run: python3 scripts/record_lineups.py
        env:
          LEAGUE_ID: "1413299628866105344"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lineups
          if git diff --cached --quiet; then
            echo "Nothing new"
            exit 0
          fi
          git commit -m "Record lineups"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
