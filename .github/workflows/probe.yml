name: Check box score history (one time)

on:
  workflow_dispatch:          # only runs when you click "Run workflow"

permissions:
  contents: write

concurrency:
  group: player-news          # never runs at the same time as the news and stats job
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check each season's box score format
        run: python scripts/probe_seasons.py

      - name: Save the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season_probe.md data/season_probe.json
          git commit -m "Box score format check" || exit 0
          git pull --rebase --autostash
          git push
