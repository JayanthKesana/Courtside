/* =====================================================================
   Stats: ESPN box scores collected by the GitHub Action, 2016-17 onward.
   stats/index.json          seasons available
   stats/totals/<season>.json season totals for every player (Players tab)
   stats/players/<id>.json   every game for one player, all seasons (player card)
   ===================================================================== */
S.stats = null; S.statsAt = 0; S.totals = {}; S.pfile = {};
const bust = () => Math.floor(Date.now() / 600e3);           // changes every 10 minutes
async function loadStats() {
  if (S.stats && Date.now() - S.statsAt < 10 * 60e3) return S.stats;
  try {
    const r = await fetch(`stats/index.json?t=${bust()}`, { cache: "no-store" });
    if (!r.ok) throw 0;
    const d = await r.json();
    S.stats = { seasons: d.seasons || [], cols: d.cols, logCols: d.log_cols, updated: d.updated };
    S.statsAt = Date.now();
  } catch { if (!S.stats) S.stats = { missing: true, seasons: [] }; }
  return S.stats;
}
/* Seasons worth showing: the current one, plus past seasons once fully collected */
const shownSeasons = () => (S.stats?.seasons || []).filter(se => se.current || se.complete);
const seasonByLabel = l => (S.stats?.seasons || []).find(se => se.label === l);
async function loadTotals(label) {
  const c = S.totals[label], se = seasonByLabel(label);
  if (c && (!se?.current || Date.now() - c.at < 10 * 60e3)) return c.players;
  try {
    const r = await fetch(`stats/totals/${encodeURIComponent(label)}.json?t=${se?.current ? bust() : "v"}`);
    if (!r.ok) throw 0;
    const d = await r.json();
    const players = {};
    for (const [pid, row] of Object.entries(d.players || {})) players[pid] = Object.fromEntries(d.cols.map((col, i) => [col, row[i]]));
    S.totals[label] = { at: Date.now(), players };
  } catch { if (!c) S.totals[label] = { at: Date.now(), players: {} }; }
  return S.totals[label].players;
}
async function loadPlayerStats(pid) {
  const c = S.pfile[pid];
  if (c && Date.now() - c.at < 10 * 60e3) return c.seasons;
  try {
    const r = await fetch(`stats/players/${encodeURIComponent(pid)}.json?t=${bust()}`);
    if (!r.ok) throw 0;
    const d = await r.json();
    const seasons = {};
    for (const [label, rows] of Object.entries(d.seasons || {}))
      seasons[label] = rows.map(row => Object.fromEntries(d.cols.map((col, i) => [col, row[i]])));
    S.pfile[pid] = { at: Date.now(), seasons };
  } catch { S.pfile[pid] = { at: Date.now(), seasons: {} }; }
  return S.pfile[pid].seasons;
}

/* Fantasy points with this league's own scoring settings.
   Works on one game line or on season totals (bonus counts are already summed there). */
function scoreWith(v) {
  const sc = S.league?.scoring_settings || {};
  let t = 0, hit = false;
  for (const [k, w] of Object.entries(sc)) if (typeof v[k] === "number" && typeof w === "number") { t += v[k] * w; hit = true; }
  return hit ? Math.round(t * 100) / 100 : null;
}
const misses = x => ({ fgmi: (x.fga || 0) - (x.fgm || 0), ftmi: (x.fta || 0) - (x.ftm || 0), tpmi: (x.tpa || 0) - (x.tpm || 0) });
function fpts(x) {                                  // one game
  const tens = ["pts", "reb", "ast", "stl", "blk"].filter(k => (x[k] || 0) >= 10).length;
  return scoreWith({ ...x, ...misses(x), dd: +(tens >= 2), td: +(tens >= 3), qd: +(tens >= 4),
    bonus_pt_40p: +(x.pts >= 40), bonus_pt_50p: +(x.pts >= 50), bonus_reb_20p: +(x.reb >= 20), bonus_ast_15p: +(x.ast >= 15) });
}
const fptsTotal = t => scoreWith({ ...t, ...misses(t) });   // a whole season
/* Per-game averages from season totals */
function avgLine(t) {
  if (!t || !t.gp) return null;
  const g = t.gp, per = k => (t[k] || 0) / g, fp = fptsTotal(t);
  return {
    gp: g, fpg: fp == null ? null : fp / g, fpt: fp,
    min: per("min"), pts: per("pts"), reb: per("reb"), ast: per("ast"), stl: per("stl"), blk: per("blk"), tpm: per("tpm"), to: per("to"),
    fgp: t.fga ? t.fgm / t.fga : null, ftp: t.fta ? t.ftm / t.fta : null, tpp: t.tpa ? t.tpm / t.tpa : null
  };
}
function seasonLine(pid, label) { return avgLine(S.totals[label]?.players?.[pid]); }
/* Totals from a list of game rows (for the player card) */
function totalsFromGames(rows) {
  const t = { gp: rows.length };
  ["min", "pts", "reb", "ast", "stl", "blk", "to", "fgm", "fga", "tpm", "tpa", "ftm", "fta"].forEach(k => t[k] = rows.reduce((a, r) => a + (r[k] || 0), 0));
  return t;
}
const n1 = v => v == null ? "—" : v.toFixed(1);
const pctf = v => v == null ? "—" : (v * 100).toFixed(1);

/* ---------- player card: season tabs, game log, career table ---------- */
S.cardSeason = null;
/* Shade a cell by how far this game was from the player's season average.
   Green = better than usual, red = worse. For turnovers, fewer is better. */
function heat(val, avg, invert) {
  if (val == null || avg == null || avg <= 0.4) return "";
  const r = (val - avg) / Math.max(avg, 1);
  if (Math.abs(r) < 0.15) return "";
  const strength = Math.min(1, Math.abs(r) / 0.6);
  const good = invert ? r < 0 : r > 0;
  return ` style="--h:${(8 + strength * 22).toFixed(0)}%" data-h="${good ? "g" : "b"}"`;
}
async function fillCardStats(id) {
  const box = $("pcStats"); if (!box) return;
  box.innerHTML = `<span class="eyebrow">Stats</span>${skeleton(2)}`;
  const [, all] = await Promise.all([loadStats(), loadPlayerStats(id)]);
  if ($("pcard").dataset.open !== id || !$("pcStats")) return;
  const showable = new Set(shownSeasons().map(se => se.label));
  const labels = Object.keys(all).filter(l => showable.has(l) && all[l].length).sort().reverse();
  if (S.stats.missing) { box.innerHTML = `<span class="eyebrow">Stats</span><div class="pc-empty">Box scores haven't been collected yet. They appear after the GitHub Action's next run.</div>`; return; }
  if (!labels.length) { box.innerHTML = `<span class="eyebrow">Stats</span><div class="pc-empty">No NBA games for ${esc(P(id)?.n || "this player")} since 2016-17.</div>`; return; }
  let label = labels.includes(S.cardSeason) ? S.cardSeason : labels[0];

  const career = labels.map(l => {
    const games = all[l], a = avgLine(totalsFromGames(games));
    const fp = games.reduce((s, r) => s + (fpts(r) || 0), 0) / games.length;
    return { l, a, fp };
  });
  const render = () => {
    const games = all[label] || [];
    const me = career.find(c => c.l === label);
    const avg = { fp: me.fp, min: me.a.min, pts: me.a.pts, reb: me.a.reb, ast: me.a.ast, stl: me.a.stl, blk: me.a.blk, tpm: me.a.tpm, to: me.a.to };
    const c = (v, k, inv, fmt = x => x, cls = "") => `<td${cls ? ` class="${cls}"` : ""}${heat(v, avg[k], inv)}>${v == null ? "—" : fmt(v)}</td>`;
    const tabs = labels.map(l => `<button type="button" role="tab" data-season="${esc(l)}" aria-selected="${l === label}">${esc(l)}</button>`).join("");
    // Career table: one row per season, shaded against the player's average across all seasons shown
    const allGames = labels.flatMap(l => all[l]);
    const ca = avgLine(totalsFromGames(allGames));
    const cfp = allGames.reduce((s, r) => s + (fpts(r) || 0), 0) / allGames.length;
    const cavg = { fp: cfp, min: ca.min, pts: ca.pts, reb: ca.reb, ast: ca.ast, stl: ca.stl, blk: ca.blk, tpm: ca.tpm, to: ca.to };
    const cc = (v, k, inv) => `<td${heat(v, cavg[k], inv)}>${n1(v)}</td>`;
    const careerRows = career.map(({ l, a, fp }) => `<tr${l === label ? ' class="on"' : ""}><td class="left">${esc(l)}</td><td>${a.gp}</td><td class="fp">${(fp * a.gp).toFixed(1)}</td>${cc(fp, "fp").replace("<td", '<td class="fp"')}${cc(a.min, "min")}${cc(a.pts, "pts")}${cc(a.reb, "reb")}${cc(a.ast, "ast")}${cc(a.stl, "stl")}${cc(a.blk, "blk")}${cc(a.tpm, "tpm")}${cc(a.to, "to", true)}<td>${pctf(a.fgp)}</td><td>${pctf(a.ftp)}</td></tr>`).join("");
    const logRows = [...games].reverse().map(r => `<tr><td class="left">${esc(r.d.slice(5).replace("-", "/"))}</td><td class="left">${r.ha === "H" ? "" : "@"}${esc(r.opp)}</td><td class="left ${String(r.res).startsWith("W") ? "w" : "l"}">${esc(r.res)}</td>
        ${c(fpts(r), "fp", false, x => x.toFixed(1), "fp")}${c(Math.round(r.min), "min")}${c(r.pts, "pts")}${c(r.reb, "reb")}${c(r.ast, "ast")}${c(r.stl, "stl")}${c(r.blk, "blk")}${c(r.tpm, "tpm")}${c(r.to, "to", true)}
        <td>${r.fgm}-${r.fga}</td><td>${r.ftm}-${r.fta}</td></tr>`).join("");
    box.innerHTML = `
      <div class="gl-head"><span class="eyebrow">Game logs</span><div class="seg tabs-scroll" role="tablist" id="glTabs">${tabs}</div></div>
      <div class="tbl-wrap stat-tbl gl"><table>
        <thead>
          <tr class="grp"><th colspan="3"></th><th class="g-fan">Fantasy</th><th colspan="8">Box score</th><th colspan="2">Shooting</th></tr>
          <tr><th class="left">Date</th><th class="left">Opp</th><th class="left">Result</th><th class="g-fan">FPTS</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>3PM</th><th>TO</th><th>FG</th><th>FT</th></tr>
        </thead>
        <tbody>
          <tr class="avg-row"><td class="left" colspan="3">Season avg · ${me.a.gp} game${me.a.gp === 1 ? "" : "s"}</td><td class="fp">${n1(me.fp)}</td><td>${n1(me.a.min)}</td><td>${n1(me.a.pts)}</td><td>${n1(me.a.reb)}</td><td>${n1(me.a.ast)}</td><td>${n1(me.a.stl)}</td><td>${n1(me.a.blk)}</td><td>${n1(me.a.tpm)}</td><td>${n1(me.a.to)}</td><td>${pctf(me.a.fgp)}%</td><td>${pctf(me.a.ftp)}%</td></tr>
          ${logRows}
        </tbody></table></div>
      <div class="ch-note muted">FPTS uses your league's scoring. Green and red cells mark games well above or below this player's ${esc(label)} average.</div>
      <span class="eyebrow career-title">Career · per game</span>
      <div class="tbl-wrap stat-tbl gl career"><table>
        <thead>
          <tr class="grp"><th colspan="2"></th><th colspan="2" class="g-fan">Fantasy</th><th colspan="8">Per game</th><th colspan="2">Shooting</th></tr>
          <tr><th class="left">Season</th><th>GP</th><th class="g-fan">FPTS</th><th class="g-fan">FP/G</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>3PM</th><th>TO</th><th>FG%</th><th>FT%</th></tr>
        </thead>
        <tbody>${careerRows}</tbody></table></div>
      <div class="ch-note muted">Green and red cells mark seasons well above or below this player's average across these seasons.</div>`;
    $("glTabs").onclick = e => { const b = e.target.closest("button[data-season]"); if (!b) return; label = S.cardSeason = b.dataset.season; render(); };
    $("glTabs").querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
  };
  render();
}

/* ---------- Players tab: Sleeper-style search ---------- */
S.pf = { q: "", pos: "ALL", avail: "all", team: "", health: "all", sort: "fpg", season: null, limit: 50, earlyNote: null };
const EARLY_SEASON_GAMES = 75;          // about 5 games per team
const POS = ["ALL", "PG", "SG", "SF", "PF", "C", "G", "F"];
const SORTS = [["fpg", "Fantasy pts per game"], ["fpt", "Total fantasy pts"], ["wk", "This week (live from Sleeper)"], ["pts", "Points"], ["reb", "Rebounds"], ["ast", "Assists"], ["stl", "Steals"], ["blk", "Blocks"], ["tpm", "3-pointers made"], ["min", "Minutes"], ["trend", "Trending adds (24 hr)"], ["name", "Name"]];
async function viewPlayers(v) {
  v.innerHTML = skeleton(6);
  await Promise.all([loadStats(), loadTrending().catch(() => {})]);
  const st = S.stats, seasons = shownSeasons();
  // This season is the default; past seasons are offered once fully collected.
  // Early in a season the current season has only a handful of games, so most players would
  // show no stats at all. Until it has EARLY_SEASON_GAMES games, default to last season instead.
  // A season the viewer picks themselves is always kept.
  if (!seasons.some(se => se.label === S.pf.season)) {
    const cur = seasons.find(se => se.current), prev = seasons.find(se => !se.current);
    const useCur = cur && (cur.games >= EARLY_SEASON_GAMES || !prev);
    S.pf.season = (useCur ? cur : prev || cur)?.label || null;
    S.pf.earlyNote = !useCur && cur && prev ? { cur: cur.label, prev: prev.label, games: cur.games } : null;
  }
  if (S.pf.season) await loadTotals(S.pf.season);
  if (S.tab !== "players") return;
  const teams = [...new Set(Object.values(S.players).map(p => p.t).filter(Boolean))].sort();
  const f = S.pf;
  v.innerHTML = `<div class="panel">
    <div class="panel-head"><div><span class="eyebrow">Every NBA player</span><h2>Players</h2></div>
      <span class="muted" id="pfMeta"></span></div>
    <div class="pfilter card">
      <div class="pf-row">
        <input id="pfQ" class="pf-in" type="search" placeholder="Search players" value="${esc(f.q)}" autocomplete="off">
        <div class="chips" id="pfPos">${POS.map(p => `<button type="button" data-pos="${p}" aria-pressed="${f.pos === p}">${p === "ALL" ? "All" : p}</button>`).join("")}</div>
      </div>
      <div class="pf-row">
        <label class="pf-sel"><span class="eyebrow">Show</span><select class="ctl" id="pfAvail">
          ${[["all", "All players"], ["avail", "Available"], ["rostered", "Rostered"], ["mine", "My team"]].map(([k, l]) => `<option value="${k}" ${f.avail === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="pf-sel"><span class="eyebrow">NBA team</span><select class="ctl" id="pfTeam"><option value="">All teams</option>${teams.map(t => `<option ${f.team === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
        <label class="pf-sel"><span class="eyebrow">Health</span><select class="ctl" id="pfHealth">
          ${[["all", "Everyone"], ["healthy", "Healthy only"], ["noout", "Hide Out"]].map(([k, l]) => `<option value="${k}" ${f.health === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="pf-sel"><span class="eyebrow">Sort by</span><select class="ctl" id="pfSort">${SORTS.map(([k, l]) => `<option value="${k}" ${f.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="pf-sel"><span class="eyebrow">Stats from</span><select class="ctl" id="pfSeason">
          ${seasons.map(se => `<option value="${esc(se.label)}" ${f.season === se.label ? "selected" : ""}>${esc(se.label)}</option>`).join("") || `<option value="">No stats yet</option>`}</select></label>
      </div>
    </div>
    ${S.pf.earlyNote && f.season === S.pf.earlyNote.prev ? `<div class="pc-empty">${esc(S.pf.earlyNote.cur)} only has ${S.pf.earlyNote.games} game${S.pf.earlyNote.games === 1 ? "" : "s"} so far, so stats are from ${esc(S.pf.earlyNote.prev)}. Switch “Stats from” to see this season. The Wk column shows each rostered player's live Sleeper points this week.</div>` : ""}
    <div class="card"><div class="tbl-wrap"><table class="ptbl"><thead><tr><th class="n">#</th><th>Player</th><th>Fantasy team</th><th class="n" title="Fantasy points this week, live from Sleeper (rostered players only)">Wk</th><th class="n">GP</th><th class="n">FP/G</th><th class="n">MIN</th><th class="n">PTS</th><th class="n">REB</th><th class="n">AST</th><th class="n">STL</th><th class="n">BLK</th><th class="n">3PM</th><th class="n">TO</th><th class="n">FG%</th></tr></thead><tbody id="pfBody"></tbody></table></div>
      <div class="pf-more" id="pfMore"></div></div>
    ${st.missing ? `<div class="pc-empty">Stats haven't been collected yet, so only names and filters work. Once the GitHub Action runs, stat columns fill in.</div>` : ""}
  </div>`;
  const rerender = () => renderPlayerRows();
  $("pfQ").oninput = e => { f.q = e.target.value; f.limit = 50; rerender(); };
  $("pfPos").onclick = e => { const b = e.target.closest("button"); if (!b) return; f.pos = b.dataset.pos; f.limit = 50; $("pfPos").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); rerender(); };
  [["pfAvail", "avail"], ["pfTeam", "team"], ["pfHealth", "health"], ["pfSort", "sort"]].forEach(([id, k]) => $(id).onchange = e => { f[k] = e.target.value; f.limit = 50; rerender(); });
  $("pfSeason").onchange = async e => { f.season = e.target.value; f.limit = 50; $("pfBody").innerHTML = `<tr><td colspan="15" class="muted">Loading ${esc(f.season)}…</td></tr>`; await loadTotals(f.season); rerender(); };
  rerender();
}
function renderPlayerRows() {
  const f = S.pf, body = $("pfBody"); if (!body) return;
  const q = norm(f.q);
  const trend = Object.fromEntries((S.trending?.add || []).map(x => [x.player_id, x.count]));
  const owners = {}; S.rosters.forEach(r => (r.players || []).forEach(p => owners[p] = r.roster_id));
  // Live points this week straight from Sleeper's matchups (covers every rostered player,
  // starters and bench). Box scores lag behind by up to one Action run; this doesn't.
  const wk = {}; (S.matchups[S.week] || []).forEach(m => Object.entries(m.players_points || {}).forEach(([pid, v]) => wk[pid] = Number(v)));
  let rows = [];
  for (const [id, p] of Object.entries(S.players)) {
    const owner = owners[id];
    if (!p.t && owner == null && !q) continue;          // unsigned players only show up when searched for
    if (!nameMatches(p.n, q)) continue;
    if (f.pos !== "ALL" && !(p.p || "").split("/").includes(f.pos)) continue;
    if (f.avail === "avail" && owner != null) continue;
    if (f.avail === "rostered" && owner == null) continue;
    if (f.avail === "mine" && !isMe(owner)) continue;
    if (f.team && p.t !== f.team) continue;
    if (f.health === "healthy" && p.i) continue;
    if (f.health === "noout" && /out|susp/i.test(p.i)) continue;
    rows.push({ id, p, owner, s: seasonLine(id, f.season), tr: trend[id] || 0, wk: wk[id] });
  }
  const key = f.sort;
  const val = r => key === "name" ? 0 : key === "trend" ? r.tr : key === "wk" ? (r.wk ?? -1e9) : r.s ? (r.s[key] ?? -1) : -1;
  rows.sort((a, b) => key === "name" ? a.p.n.localeCompare(b.p.n) : (val(b) - val(a)) || a.p.n.localeCompare(b.p.n));
  const shown = rows.slice(0, f.limit);
  const tag = o => o == null ? `<span class="badge ok first">Available</span>` : isMe(o) ? `<span class="badge home first">Yours</span>` : `<span class="badge plain first">${esc(teamName(o))}</span>`;
  body.innerHTML = shown.length ? shown.map((r, i) => {
    const s = r.s;
    const c = k => `<td class="n${key === k ? " hi" : ""}">${s ? n1(s[k]) : "—"}</td>`;
    return `<tr><td class="n muted">${i + 1}</td><td><div class="pcell">${headshot(r.id, 34)}<span class="t"><b>${pBtn(r.id)}${injury(r.id)}</b><small>${esc(r.p.p || "")} · ${esc(r.p.t || "Free agent")}${key === "trend" && r.tr ? ` · +${r.tr.toLocaleString()} adds` : ""}</small></span></div></td>
      <td>${tag(r.owner)}</td><td class="n${key === "wk" ? " hi" : ""}">${r.wk == null ? "—" : r.wk.toFixed(1)}</td><td class="n">${s ? s.gp : "—"}</td>${c("fpg")}${c("min")}${c("pts")}${c("reb")}${c("ast")}${c("stl")}${c("blk")}${c("tpm")}${c("to")}<td class="n">${s ? pctf(s.fgp) : "—"}</td></tr>`;
  }).join("") : `<tr><td colspan="15" class="muted">No players match these filters.</td></tr>`;
  $("pfMore").innerHTML = rows.length > f.limit ? `<button type="button" class="ctl" id="pfMoreBtn">Show more (${(rows.length - f.limit).toLocaleString()} left)</button>` : "";
  $("pfMoreBtn")?.addEventListener("click", () => { f.limit += 50; renderPlayerRows(); });
  const st = S.stats;
  $("pfMeta").textContent = `${rows.length.toLocaleString()} players · ${st?.missing ? "no stats yet" : `box scores updated ${st?.updated ? ago(st.updated) : "—"}`}`;
}
/* Search text: accents dropped, hyphens become spaces ("Karl-Anthony" -> "karl anthony"),
   other punctuation dropped ("P.J." -> "pj", "De'Aaron" -> "deaaron"), spaces collapsed. */
function norm(s) {
  return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[-_‐-―]/g, " ").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
}
/* A name matches if the query appears in it with or without spaces, so "karl anthony",
   "karlanthony", "gilgeous alexander" and "gilgeous-alexander" all find their player. */
function nameMatches(name, q) {
  if (!q) return true;
  const n = norm(name);
  return n.includes(q) || n.replace(/ /g, "").includes(q.replace(/ /g, ""));
}

/* ---------- events ---------- */
$("findBtn").onclick = findLeagues;
$("userIn").onkeydown = e => { if (e.key === "Enter") findLeagues(); };
$("openIdBtn").onclick = () => { const id = $("leagueIn").value.trim().match(/\d{10,}/)?.[0]; if (id) openLeague(id); };
$("leagueIn").onkeydown = e => { if (e.key === "Enter") $("openIdBtn").click(); };
$("tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.tab = b.dataset.tab; if (S.tab !== "matchup") S.focusMatch = null; try { localStorage.setItem("cs_tab", S.tab); } catch {} render(); };
$("weekSel").onchange = async e => { S.week = Number(e.target.value); S.tx = null; S.focusMatch = null; $("view").innerHTML = skeleton(4); await refresh(); };
$("teamSel").onchange = e => {
  S.myRosterId = Number(e.target.value) || null; S.viewRoster = S.myRosterId || S.viewRoster;
  const saved = store.get("cs_league") || {}; store.set("cs_league", { ...saved, myRosterId: S.myRosterId }); render();
};
$("refreshBtn").onclick = async () => { await loadNews(true); refresh(); };
document.addEventListener("click", e => {
  const t = e.target.closest("[data-pid]");
  if (!t || !S.league) return;
  e.preventDefault(); e.stopPropagation();
  openCard(t.dataset.pid);
}, true);
$("pcard").addEventListener("click", e => { if (e.target === $("pcard")) $("pcard").close(); });
$("changeBtn").onclick = () => {
  store.del("cs_league");
  $("main").hidden = true; $("headActions").hidden = true; $("leagueMeta").hidden = true;
  $("setup").hidden = false; $("leaguePick").innerHTML = ""; $("setupMsg").innerHTML = "";
};
/* Live updates: on by default, refresh every minute while the page is visible.
   Turning it off is remembered on this device. */
const liveOn = () => $("autoRef").checked && S.league && !$("main").hidden;
$("autoRef").onchange = e => { store.set("cs_live", e.target.checked); if (S.league) refresh(); };
setInterval(() => { if (liveOn() && !document.hidden) refresh(); }, 60000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && liveOn() && Date.now() - (S.lastRefresh || 0) > 60000) refresh();
});

/* ---------- boot ---------- */
(async function boot() {
  try { S.tab = localStorage.getItem("cs_tab") || "matchup"; } catch {}
  if (store.get("cs_live") === false) $("autoRef").checked = false;
  const u = store.get("cs_user"); if (u?.name) $("userIn").value = u.name;
  const saved = store.get("cs_league");
  if (saved?.leagueId) await openLeague(saved.leagueId, saved.userId);
  else $("setup").hidden = false;
})();
</script>
</body>
